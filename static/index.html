<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event & Weather Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Event & Weather Hub</h1>
            <p>Plan your next outing with perfect weather.</p>
        </header>
        
        <div class="search-section">
            <input type="text" id="city-input" required>
            <button id="search-btn">Explore City</button>
        </div>

        <div id="loading" class="hidden">Fetching data...</div>
        <div id="error" class="hidden error-text"></div>

        <div id="results" class="hidden">
            <div class="weather-card glass-panel">
                <h2>Current Weather in <span id="weather-city"></span></h2>
                <div class="weather-details">
                    <div class="temp"><span id="weather-temp"></span>°C</div>
                    <div class="desc" id="weather-desc"></div>
                    <div class="stats">
                        <span>Humidity: <span id="weather-humidity"></span>%</span>
                        <span>Wind: <span id="weather-wind"></span> m/s</span>
                    </div>
                </div>
            </div>

            <div class="events-section glass-panel">
                <h2>Upcoming Events</h2>
                <div id="events-list" class="events-grid"></div>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
